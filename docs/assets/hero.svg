<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="bo3mac: Native Apple Silicon ARM64 and Direct Metal Port of Call of Duty: Black Ops III">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#1a120b"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ff6a00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="44" y="42" width="6" height="106" rx="3" fill="url(#accent)"/>

  <!-- Eyebrow tag -->
  <rect x="66" y="42" width="330" height="28" rx="14" fill="#ff6a00" fill-opacity="0.16" stroke="#ff6a00" stroke-opacity="0.45" stroke-width="1"/>
  <text x="82" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#ff9447">NATIVE APPLE SILICON · ZERO ROSETTA 2</text>

  <!-- Title -->
  <text x="66" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">bo3<tspan fill="#ff6a00">mac</tspan></text>

  <!-- Subtitle -->
  <text x="66" y="168" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1">Call of Duty: Black Ops III statically recompiled to native ARM64 + Direct Metal</text>
  <text x="66" y="196" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Built locally in ~2–4 minutes from your own Steam copy · Preserved beyond macOS 28 &amp; Rosetta 2 EOL</text>

  <!-- Right-side chip badge -->
  <g transform="translate(880, 46)">
    <rect width="272" height="148" rx="14" fill="#0f141e" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    <text x="20" y="30" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">EXECUTION PIPELINE</text>
    <text x="20" y="58" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">x86_64 Steam Binary</text>
    <text x="20" y="78" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#ff8c3a">  ↓ Zydis → LLVM IR → -O2</text>
    <text x="20" y="98" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#4ade80">Native ARM64 (proc_translated=0)</text>
    <text x="20" y="122" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">D3D11 → Direct Metal + MetalFX</text>
  </g>

  <!-- Bottom stat cards -->
  <g transform="translate(44, 232)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="262" height="106" rx="12" fill="#131926" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">BASE M4 · 1080p ZOMBIES</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">60.5 <tspan font-size="18" font-weight="600" fill="#ff7a18">FPS</tspan></text>
    <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8">15.05 ms GPU · Round 15 hordes</text>

    <!-- Card 2 -->
    <rect x="282" y="0" width="262" height="106" rx="12" fill="#131926" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    <text x="302" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">APPLE TBDR BANDWIDTH</text>
    <text x="302" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#4ade80">-48%</text>
    <text x="302" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Deferred clears · Lossy RT · MetalFX</text>

    <!-- Card 3 -->
    <rect x="564" y="0" width="262" height="106" rx="12" fill="#131926" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    <text x="584" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">PRESERVATION</text>
    <text x="584" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">macOS 28+</text>
    <text x="584" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8">No Rosetta 2 · Runs natively on ARM</text>

    <!-- Card 4 -->
    <rect x="846" y="0" width="262" height="106" rx="12" fill="#131926" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    <text x="866" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">ONLINE &amp; WORKSHOP</text>
    <text x="866" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">v100 + Mods</text>
    <text x="866" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a3b8">Native Havok nav · Friends-Only</text>
  </g>
</svg>
